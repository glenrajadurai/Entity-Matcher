# Configuration for Member 3 ML Pipeline

data:
  s1_id_col: "s1_entity_id"
  candidate_id_col: "candidate_entity_id"
  source_col: "source"
  target_col: "label"
  exclude_cols:
    - "s1_entity_id"
    - "candidate_entity_id"
    - "source"
    - "label"


split:
  strategy: "group_kfold"  # Entity-level GroupKFold on s1_entity_id
  n_splits: 5
  random_state: 42
  val_size: 0.2

models:
  candidate_models:
    - "lightgbm"
    - "xgboost"
    - "catboost"
    - "hist_gradient_boosting"

  lightgbm:
    n_estimators: 300
    learning_rate: 0.05
    max_depth: 6
    random_state: 42

  xgboost:
    n_estimators: 300
    learning_rate: 0.05
    max_depth: 6
    random_state: 42

  catboost:
    iterations: 300
    learning_rate: 0.05
    depth: 6
    random_seed: 42
    verbose: 0

  hist_gradient_boosting:
    max_iter: 300
    learning_rate: 0.05
    max_depth: 6
    random_state: 42

threshold_tuning:
  metric: "accuracy"  # Primary metric updated to accuracy as requested
  beta: 0.5
  step: 0.02
  min_threshold: 0.05
  max_threshold: 0.95


output:
  model_dir: "models/candidate/"
  final_model_dir: "models/final/"
  report_dir: "reports/"
